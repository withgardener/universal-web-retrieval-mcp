name: Release launcher to npm

# Publishes the npx launcher ONLY when a GitHub Release is published (e.g. v0.2.0).
# Plain pushes, tags and PRs never reach the registry.
# Publishes the scoped package `@withgardener/uwr` only: npm rejects the bare name
# `uwr` as too similar to existing packages (E403).
# Auth: NPM_TOKEN secret in the `npm` environment (read/write on @withgardener/uwr).
# Provenance attestations are generated via OIDC, so the job needs id-token: write.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Test & publish (provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Run launcher unit tests
        run: node --test npm/test/*.test.js

      - name: Verify version agreement (tag == npm/package.json == pyproject)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          NPM_VER=$(node -p "require('./npm/package.json').version")
          PY_VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=$TAG npm=$NPM_VER pyproject=$PY_VER"
          if [ "$TAG" != "$NPM_VER" ]; then
            echo "::error::release tag '$TAG' does not match npm/package.json version '$NPM_VER'"
            exit 1
          fi
          if [ "$PY_VER" != "$NPM_VER" ]; then
            echo "::error::pyproject version '$PY_VER' does not match npm/package.json version '$NPM_VER'"
            exit 1
          fi

      - name: Wait for uwr==<version> on PyPI (the launcher pins it)
        run: |
          set -euo pipefail
          VER=$(node -p "require('./npm/package.json').version")
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/uwr/${VER}/json"; then
              echo "uwr ${VER} is on PyPI"; exit 0
            fi
            echo "waiting for uwr ${VER} on PyPI (${i}/60)"; sleep 20
          done
          echo "::error::uwr ${VER} did not appear on PyPI within 20 minutes; not publishing a launcher that cannot start"
          exit 1

      - name: Publish @withgardener/uwr
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./npm/package.json').name")
          VER=$(node -p "require('./npm/package.json').version")
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VER} is already published — skipping (idempotent re-run)"
            exit 0
          fi
          ( cd npm && npm publish --provenance --access public )
