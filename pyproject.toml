[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uwr"
version = "0.2.3"
# PyPI distribution name: `uwr` (target: `uvx uwr` / `pip install uwr`).
# GitHub repo remains withgardener/universal-web-retrieval-mcp; import module
# stays universal_web_retrieval; MCP server name stays universal-web-retrieval.
description = "A universal MCP server providing resilient web search and content retrieval through a configurable provider chain (AnySearch, Tavily, DDGS, Tencent Yuanbao Search, Bocha, DeepSeek) with automatic failover."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "withgardener"}]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27,<1",
    "ddgs>=9.16,<10",
]

[project.scripts]
uwr = "universal_web_retrieval.cli:main"
universal-web-retrieval = "universal_web_retrieval.server:main"

[tool.setuptools.packages.find]
where = ["src"]
